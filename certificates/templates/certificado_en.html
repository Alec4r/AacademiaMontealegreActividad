<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate of completion</title>
</head>
<body>
  <!-- Example Academia Horizonte logo -->
  <img src="logo-academia-horizonte.png" alt="Academia Horizonte" width="150" />

  <h1>Certificate of completion</h1>

  <p>
    This certifies that <strong>{{student_name}}</strong> successfully completed
    the course <strong>{{course_name}}</strong>.
  </p>

  <p>Date: {{date}}</p>

  <!-- Example signature -->
  <p>
    _______________________<br />
    Academic Office, Academia Horizonte
  </p>
</body>
</html>
