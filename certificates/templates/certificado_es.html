<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Certificado de finalización</title>
</head>
<body>
  <!-- Logo de ejemplo de Academia Horizonte -->
  <img src="logo-academia-horizonte.png" alt="Academia Horizonte" width="150" />

  <h1>Certificado de finalización</h1>

  <p>
    Se certifica que <strong>{{student_name}}</strong> completó satisfactoriamente
    el curso <strong>{{course_name}}</strong>.
  </p>

  <p>Fecha: {{date}}</p>

  <!-- Firma de ejemplo -->
  <p>
    _______________________<br />
    Dirección Académica, Academia Horizonte
  </p>
</body>
</html>
